# Pinned dependency versions live in Cargo.lock, which is committed on purpose.
# The toolchain is nightly-2024-01-21 (see rust-toolchain.toml) because the
# Lagrange plonky2 fork uses feature(stdsimd), removed from Rust in mid-2024.
# That old toolchain cannot build crates whose MSRV is newer, so several
# transitive deps are held back: rayon 1.10.0 / rayon-core 1.12.1,
# time 0.3.36 and its family. Do not run `cargo update`.
# Known exception: the windows-* crates resolve to versions requiring rustc
# 1.82 and cannot be downgraded further. They are Windows-only targets and are
# never built on Linux or macOS, so CI is unaffected.

[package]
name = "reckle_volatility"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.40"
itertools = { version = "0.12.0", default-features = false, features = ["use_alloc"] }
log = "0.4.14"
num = { version = "0.4.0", default-features = false }
num-traits = "0.2"
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng", "getrandom"] }

plonky2 = "0.1.4"
plonky2_crypto = { git = "https://github.com/Lagrange-Labs/plonky2-crypto", rev = "17d69309ead3e5ee0927fd264e0b9cbc31551452" }

[patch.crates-io]
plonky2 = { git = "https://github.com/Lagrange-Labs/plonky2", rev = "3205601900b02fa23e9a894e8ceba65d99258a23" }

[dev-dependencies]
env_logger = { version = "0.11.3", default-features = false }
serde_json = "1.0"

[profile.release]
debug = false
